name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (>=22.12.0)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Quality Checks (Oxlint)
        run: npm run lint

      - name: Run Security Vulnerability Audit
        run: npm audit --audit-level=moderate

      - name: Run Unit and Component Tests (Vitest)
        run: npm run test

      - name: Verify Production Build
        run: npm run build
