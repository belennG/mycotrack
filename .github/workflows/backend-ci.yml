name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-lint:
    name: Run Tests and Code Quality Checks
    runs-on: ubuntu-latest

    # Set up a temp PostgreSQL database in the cloud just for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test across multiple Python versions
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    # Download code into the cloud server
    - name: Checkout Code
      uses: actions/checkout@v7

    # Install the specific Python version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up future runs
        cache-dependency-path: backend/requirements-dev.txt

    # Install the requirements: the runtime packages plus the development tools
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements-dev.txt

    # Formatting & Linting
    - name: Check Code Formatting (Black)
      run: black backend --check

    - name: Check Code Style (Flake8)
      run: flake8 backend --max-line-length=100

    - name: Static Type Checking (Mypy)
      run: mypy backend --ignore-missing-imports

    # Security Scanning
    - name: Security Scan (Bandit)
      run: bandit -r backend || true # || true prevents failure if we don't have a config yet

    # Advisory here (pip-audit has no severity levels, and a new advisory should not block an
    # unrelated change). The weekly Security audit workflow is what raises the alarm.
    - name: Dependency Vulnerability Check (pip-audit)
      run: pip-audit -r backend/requirements.txt --no-deps --disable-pip || true

    - name: Run Database Migrations
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        cd backend
        alembic upgrade head

    # Fails if the models and the migrations disagree (e.g. a column type that was changed in
    # the model but never migrated).
    - name: Check models match migrations
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        cd backend
        alembic check

    # Testing
    - name: Run Pytest
      env:
        # Tell FastAPI app to use the temporary cloud database we made above
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        cd backend
        pytest --cov=. --cov-report=xml
