name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-and-lint:
    name: Run Tests and Code Quality Checks
    runs-on: ubuntu-latest
    
    # Set up a temp PostgreSQL database in the cloud just for testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Test across multiple Python versions
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    # Download code into the cloud server
    - name: Checkout Code
      uses: actions/checkout@v4

    # Install the specific Python version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Speeds up future runs

    # Install the requirements
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    # Formatting & Linting
    - name: Check Code Formatting (Black)
      run: black backend --check

    - name: Check Code Style (Flake8)
      run: flake8 backend --max-line-length=100

    - name: Static Type Checking (Mypy)
      run: mypy backend --ignore-missing-imports

    # Security Scanning
    - name: Security Scan (Bandit)
      run: bandit -r backend -c "bandit.yml" || true # || true prevents failure if we don't have a config yet

    - name: Dependency Vulnerability Check (Safety)
      run: safety check -r backend/requirements.txt || true # || true to warn instead of failing immediately

    # Testing
    - name: Run Pytest
      env:
        # Tell FastAPI app to use the temporary cloud database we made above
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        cd backend
        pytest --cov=. --cov-report=xml